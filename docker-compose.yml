services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    restart: always

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    depends_on:
      - ollama
      - database
    environment:
      - NODE_ENV=production
      - LLM_BASE_URL=http://ollama:11434/v1
      - LLM_MODEL=${LLM_MODEL:-gpt-oss-120b}
      - LLM_API_KEY=ollama
    restart: always

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - /mnt/t/.lmstudio/models:/models:ro
    environment:
      - OLLAMA_NUM_PARALLEL=1
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  database:
    image: postgres:16
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=mydb
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata:
  ollama_data: