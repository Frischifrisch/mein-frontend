<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #app {
      width: 100%;
      max-width: 780px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
    }
    h1 {
      text-align: center;
      font-size: 1.2rem;
      color: #a78bfa;
      letter-spacing: 0.05em;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px 0;
      scrollbar-width: thin;
      scrollbar-color: #3b3b5c transparent;
    }
    .msg {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      background: #6d28d9;
      color: #fff;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      background: #16213e;
      color: #e0e0e0;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
      border: 1px solid #2d2d5e;
    }
    .msg.error {
      background: #450a0a;
      color: #fca5a5;
      align-self: center;
      font-size: 0.85rem;
    }
    .typing {
      display: flex;
      gap: 6px;
      padding: 14px 18px;
      background: #16213e;
      border: 1px solid #2d2d5e;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      align-self: flex-start;
    }
    .dot {
      width: 8px; height: 8px;
      background: #a78bfa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-8px); }
    }
    #input-area {
      display: flex;
      gap: 8px;
    }
    #input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid #3b3b5c;
      background: #16213e;
      color: #e0e0e0;
      font-size: 0.95rem;
      outline: none;
      resize: none;
      height: 48px;
      line-height: 1.4;
    }
    #input:focus { border-color: #6d28d9; }
    #send {
      padding: 0 20px;
      border-radius: 24px;
      border: none;
      background: #6d28d9;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    #send:hover { background: #5b21b6; }
    #send:disabled { background: #3b3b5c; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="app">
    <h1>🤖 KI-Chat</h1>
    <div id="messages"></div>
    <div id="input-area">
      <textarea id="input" placeholder="Nachricht eingeben..." rows="1"></textarea>
      <button id="send">➤</button>
    </div>
  </div>

  <script>
    const BACKEND = 'http://localhost:3001';
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing';
      div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      sendBtn.disabled = true;

      addMessage('user', text);
      history.push({ role: 'user', content: text });

      const typing = showTyping();
      try {
        const res = await fetch(`${BACKEND}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });
        const data = await res.json();
        typing.remove();
        if (data.error) {
          addMessage('error', '⚠️ ' + data.error);
        } else {
          addMessage('assistant', data.reply);
          history.push({ role: 'assistant', content: data.reply });
        }
      } catch {
        typing.remove();
        addMessage('error', '⚠️ Backend nicht erreichbar.');
      }
      sendBtn.disabled = false;
      input.focus();
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
